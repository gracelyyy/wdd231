<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <link rel="stylesheet" href="styles/chamber.css">

    <script defer>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);

            document.getElementById("fname").textContent =
                params.get("firstname");

            document.getElementById("lname").textContent =
                params.get("lastname");

            document.getElementById("email").textContent =
                params.get("email");

            document.getElementById("phone").textContent =
                params.get("phone");

            document.getElementById("business").textContent =
                params.get("business");

            document.getElementById("timestamp").textContent =
                params.get("timestamp");
        });
    </script>
</head>
<body>

<header>
    <h1>Maseru Chamber of Commerce</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="directory.html">Directory</a>
    <a href="discover.html">Discover</a>
    <a href="join.html">Join</a>
</nav>

<main>

    <h2>Thank You for Applying!</h2>

    <p>We have received your membership application.</p>

    <div class="submission-info">
        <p><strong>First Name:</strong> <span id="fname"></span></p>
        <p><strong>Last Name:</strong> <span id="lname"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <p><strong>Phone:</strong> <span id="phone"></span></p>
        <p><strong>Business:</strong> <span id="business"></span></p>
        <p><strong>Date Submitted:</strong> <span id="timestamp"></span></p>
    </div>

</main>

<footer>
    <p>&copy; 2026 Maseru Chamber of Commerce</p>
</footer>

</body>
</html>
