<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Grace M">
    <meta name="description" content="Browse premium wigs from Laid with Grace.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Laid with Grace Collection">
    <meta property="og:description" content="Luxury wig collection.">
    <meta property="og:image" content="https://your-github-username.github.io/wdd231/final/images/logo.webp">
    <meta property="og:url" content="https://your-github-username.github.io/wdd231/final/collection.html">

    <title>Laid with Grace | Collection</title>

    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">

    <script type="module" src="js/collection.js" defer></script>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="images/logo.webp" alt="Laid with Grace Logo" width="80" height="80">
        <h1>Laid with Grace</h1>
    </div>

    <button id="menu-btn" aria-label="Menu">☰</button>

    <nav id="navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="collection.html" class="active">Collections</a></li>
            <li><a href="booking.html">Book Appointment</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="page-banner">
        <h2>Our Wig Collection</h2>
        <p>
            Explore our luxury wigs designed for confidence, beauty, and style.
        </p>
    </section>

    <section class="controls">

        <label for="filter">
            Filter by Texture:
        </label>

        <select id="filter">
            <option value="all">All Styles</option>
            <option value="Straight">Straight</option>
            <option value="Body Wave">Body Wave</option>
            <option value="Deep Wave">Deep Wave</option>
            <option value="Curly">Curly</option>
        </select>

    </section>

    <section id="wig-container" class="wig-grid">
        <!-- Cards generated by JavaScript -->
    </section>

</main>

<!-- Modal Dialog -->
<dialog id="wigModal">

    <div id="modalContent"></div>

    <button id="closeModal">
        Close
    </button>

</dialog>

<footer>
    <p>&copy; <span id="year"></span> Laid with Grace</p>

    <p>
        <a href="attributions.html">Attributions</a> |
        <a href="https://youtube.com/" target="_blank">Project Video</a>
    </p>

    <p id="lastModified"></p>
</footer>
